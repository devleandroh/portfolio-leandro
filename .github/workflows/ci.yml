name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Aplica migrations + seeds em um PostgreSQL embarcado e compara com o gerador.
      - run: npm run db:verify
      # Build sem variáveis do Supabase: valida o modo de dados sintéticos locais.
      - run: npm run build
